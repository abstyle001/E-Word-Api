# ============================================
# E-Word-Api Docker Compose 配置
# 启动: docker compose -f docker-compose.yml up -d
# 停止: docker compose -f docker-compose.yml down
# ============================================

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eword-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123."
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Admin123." -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eword-api
    ports:
      - "5194:5194"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=eword;User Id=sa;Password=Admin123.;TrustServerCertificate=True"
      JWT__Issuer: "http://localhost:5194"
      JWT__Audience: "http://localhost:5194"
      JWT__SigningKey: "coldtrackvinavuiahivanuiabvniaovnauvbavioanvduasbvuaisvonauviasuvbasvuaibvauvbdaovbuavb"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver-data:
